<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UniTrade</title>
  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

  <div class="background"></div>

  <div class="card">

    <h1 class="logo">UniTrade System</h1>

    <!-- LOGIN -->
    <div id="loginPage">

      <h2>Welcome Back</h2>

      <input id="loginEmail" placeholder="Email">
      <input id="loginPassword" type="password" placeholder="Password">

      <button onclick="login()">Login</button>

      <p onclick="showRegister()">Don’t have an account? <span>Register</span></p>
    </div>

    <!-- REGISTER -->
    <div id="registerPage" class="hidden">

      <h2>Create Account</h2>

      <input id="name" placeholder="Full Name">
      <input id="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <input id="university" placeholder="University">

      <button onclick="register()">Create Account</button>

      <p onclick="showLogin()">Already have an account? <span>Login</span></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">

      <h2>Welcome</h2>
      <p id="userInfo"></p>

      <button class="logout" onclick="logout()">Logout</button>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
